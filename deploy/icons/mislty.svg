<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8b5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#252b40" stroke-width="4" />
  <rect x="16" y="16" width="224" height="224" rx="44" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- RF Signal Arcs radiating from top -->
  <path d="M 88 56 A 60 60 0 0 1 168 56" fill="none" stroke="#252b40" stroke-width="5" stroke-linecap="round" />
  <path d="M 98 68 A 45 45 0 0 1 158 68" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 108 80 A 30 30 0 0 1 148 80" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Feline Ears -->
  <polygon points="64,116 88,64 116,104" fill="#181c2b" stroke="url(#cyanGrad)" stroke-width="3" stroke-linejoin="round" />
  <polygon points="76,110 88,78 104,104" fill="#f39c12" opacity="0.35" />

  <polygon points="192,116 168,64 140,104" fill="#181c2b" stroke="url(#cyanGrad)" stroke-width="3" stroke-linejoin="round" />
  <polygon points="180,110 168,78 152,104" fill="#f39c12" opacity="0.35" />

  <!-- Feline Head Mask -->
  <path d="M 64 116 C 64 172, 192 172, 192 116 C 192 108, 172 112, 128 112 C 84 112, 64 108, 64 116 Z"
        fill="#181c2b" stroke="#252b40" stroke-width="3" />

  <!-- Glowing Cyan Eyes -->
  <ellipse cx="98" cy="136" rx="14" ry="9" fill="url(#cyanGrad)" filter="url(#glow)" />
  <polygon points="98,129 101,136 98,143 95,136" fill="#0c0e14" />

  <ellipse cx="158" cy="136" rx="14" ry="9" fill="url(#cyanGrad)" filter="url(#glow)" />
  <polygon points="158,129 161,136 158,143 155,136" fill="#0c0e14" />

  <!-- Cyber Whiskers -->
  <line x1="52" y1="138" x2="80" y2="142" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="50" y1="150" x2="80" y2="150" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <line x1="204" y1="138" x2="176" y2="142" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="206" y1="150" x2="176" y2="150" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Nose & Mouth -->
  <polygon points="128,148 123,142 133,142" fill="#f39c12" />
  <path d="M 124 152 Q 128 156 132 152" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round" />

  <!-- 4G LTE Signal Meter Badge -->
  <rect x="76" y="184" width="104" height="34" rx="10" fill="#141721" stroke="url(#cyanGrad)" stroke-width="1.5" />
  <text x="128" y="206" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-weight="900" font-size="14" letter-spacing="2">4G LTE</text>
  <circle cx="88" cy="201" r="3.5" fill="#00e676" />
</svg>
